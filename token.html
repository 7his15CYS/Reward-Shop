<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="查詢代夾物 A 至 F 所對應的實際獎品" />
  <title>代夾物</title>
  <style>
    :root {
      --text: #1d2940;
      --muted: #5c6d86;
      --line: rgba(255, 255, 255, 0.45);
      --accent: #6a5cff;
      --accent-2: #4fa3ff;
      --card: rgba(255, 255, 255, 0.82);
      --card-2: rgba(255, 255, 255, 0.74);
      --shadow: 0 10px 30px rgba(31, 45, 76, 0.12);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    html, body { min-height: 100%; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC",
        "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
      color: var(--text);
      position: relative;
      overflow-x: hidden;
      background: #eaf2ff;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: url("assets/backgrounds/claw-bg.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: brightness(0.9) saturate(1.05);
      z-index: -2;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background:
        linear-gradient(rgba(245, 249, 255, 0.72), rgba(245, 249, 255, 0.84)),
        radial-gradient(circle at top left, rgba(255, 182, 193, 0.18), transparent 25rem),
        radial-gradient(circle at top right, rgba(173, 216, 255, 0.18), transparent 25rem),
        radial-gradient(circle at bottom left, rgba(255, 223, 186, 0.18), transparent 25rem);
      z-index: -1;
    }

    button { font: inherit; }

    .page {
      width: min(1280px, calc(100% - 28px));
      margin: 32px auto 56px;
    }

    .topbar,
    .guide-main,
    .guide-steps,
    .catalog,
    .notice {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.62);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .topbar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
      border-radius: 24px;
      padding: 22px 24px;
      background: rgba(255, 255, 255, 0.70);
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 4vw, 44px);
      letter-spacing: 0.02em;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 15px;
      font-weight: 650;
    }

    .nav {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin: 20px 0 26px;
    }

    .nav a {
      color: var(--text);
      text-decoration: none;
      font-weight: 800;
      border: 1px solid rgba(255, 255, 255, 0.55);
      background: rgba(255, 255, 255, 0.72);
      border-radius: 999px;
      padding: 12px 18px;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.08);
      backdrop-filter: blur(10px);
    }

    .nav a.active,
    .nav a:hover {
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-color: transparent;
    }

    .guide {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(310px, 0.65fr);
      gap: 20px;
      margin-bottom: 22px;
    }

    .guide-main,
    .guide-steps {
      border-radius: 24px;
    }

    .guide-main {
      position: relative;
      overflow: hidden;
      min-height: 260px;
      padding: 30px;
    }

    .guide-main::after {
      content: "A  B  C  D  E  F";
      position: absolute;
      right: -22px;
      bottom: 0;
      color: rgba(106, 92, 255, 0.075);
      font-size: clamp(60px, 9vw, 112px);
      font-weight: 950;
      white-space: nowrap;
      pointer-events: none;
    }

    .eyebrow {
      position: relative;
      z-index: 1;
      display: inline-flex;
      margin-bottom: 15px;
      color: #315b85;
      background: rgba(244, 249, 255, 0.86);
      border: 1px solid rgba(180, 211, 246, 0.8);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 14px;
      font-weight: 850;
    }

    .guide-title {
      position: relative;
      z-index: 1;
      margin: 0;
      max-width: 780px;
      font-size: clamp(27px, 4vw, 42px);
      line-height: 1.2;
      font-weight: 950;
    }

    .guide-text {
      position: relative;
      z-index: 1;
      max-width: 760px;
      margin: 15px 0 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.8;
      font-weight: 650;
    }

    .guide-text strong { color: #4f6cff; }

    .guide-steps {
      padding: 22px;
      display: grid;
      gap: 12px;
      align-content: center;
    }

    .step {
      display: grid;
      grid-template-columns: 44px 1fr;
      gap: 13px;
      align-items: center;
      padding: 13px;
      border-radius: 18px;
      background: linear-gradient(180deg, var(--card), var(--card-2));
      border: 1px solid rgba(255, 255, 255, 0.58);
    }

    .step-number {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      font-weight: 950;
      box-shadow: 0 8px 18px rgba(106, 92, 255, 0.2);
    }

    .step strong { display: block; margin-bottom: 3px; }
    .step span { color: var(--muted); font-size: 13px; font-weight: 650; }

    .catalog {
      padding: 20px;
      border-radius: 24px;
    }

    .prize-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px;
    }

    .prize-card {
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 490px;
      border: 1px solid rgba(255, 255, 255, 0.58);
      border-radius: 24px;
      background: linear-gradient(180deg, var(--card), var(--card-2));
      box-shadow: 0 8px 22px rgba(31, 45, 76, 0.08);
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .prize-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 34px rgba(31, 45, 76, 0.13);
    }

    .mapping-head {
      display: grid;
      grid-template-columns: 82px 44px 1fr;
      align-items: center;
      gap: 10px;
      padding: 17px 18px;
      background: rgba(255, 255, 255, 0.74);
      border-bottom: 1px solid rgba(255, 255, 255, 0.58);
    }

    .code-box {
      width: 82px;
      height: 56px;
      display: grid;
      place-items: center;
      color: #fff;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--visual-a), var(--visual-b));
      font-size: 30px;
      font-weight: 950;
      box-shadow: 0 9px 18px rgba(31, 45, 76, 0.14);
    }

    .mapping-arrow {
      text-align: center;
      color: #6a5cff;
      font-size: 27px;
      font-weight: 950;
    }

    .mapping-copy small {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 850;
      letter-spacing: 0.08em;
    }

    .mapping-copy strong {
      display: block;
      margin-top: 4px;
      font-size: 15px;
      line-height: 1.35;
    }

    .prize-visual {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 16px;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.96), transparent 28%),
        linear-gradient(135deg, var(--visual-soft-a), var(--visual-soft-b));
      border-bottom: 1px solid rgba(255, 255, 255, 0.58);
    }

    .prize-visual::before,
    .prize-visual::after {
      content: "✦";
      position: absolute;
      color: rgba(255, 255, 255, 0.78);
      font-size: 27px;
    }

    .prize-visual::before { top: 24px; left: 28px; }
    .prize-visual::after { right: 28px; bottom: 22px; font-size: 19px; }

    .prize-visual img {
      display: block;
      position: absolute;
      inset: 16px;
      width: calc(100% - 32px);
      height: calc(100% - 32px);
      max-width: none;
      max-height: none;
      object-fit: contain;
      object-position: center center;
      z-index: 2;
      filter: drop-shadow(0 12px 18px rgba(31, 45, 76, 0.18));
    }

    .image-placeholder {
      position: absolute;
      z-index: 1;
      display: grid;
      place-items: center;
      text-align: center;
      color: rgba(29, 41, 64, 0.72);
      font-weight: 900;
    }

    .placeholder-letter {
      width: 118px;
      height: 118px;
      display: grid;
      place-items: center;
      margin: 0 auto 10px;
      border-radius: 36px;
      color: #fff;
      background: linear-gradient(135deg, var(--visual-a), var(--visual-b));
      border: 2px solid rgba(255, 255, 255, 0.62);
      box-shadow: 0 17px 32px rgba(31, 45, 76, 0.14);
      font-size: 62px;
      font-weight: 950;
    }

    .placeholder-caption { font-size: 12px; }

    .prize-body {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 22px 24px 24px;
    }

    .prize-label {
      align-self: flex-start;
      color: #255782;
      background: rgba(243, 248, 255, 0.86);
      border: 1px solid rgba(180, 211, 246, 0.78);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 13px;
      font-weight: 900;
    }

    .prize-name {
      margin: 13px 0 0;
      font-size: 23px;
      line-height: 1.3;
      font-weight: 950;
    }

    .prize-desc {
      margin: 11px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
      font-weight: 650;
    }

    .exchange-note {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin-top: auto;
      padding-top: 20px;
      color: #365675;
      font-size: 13px;
      line-height: 1.55;
      font-weight: 750;
    }

    .exchange-note::before {
      content: "✓";
      flex: 0 0 auto;
      width: 23px;
      height: 23px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      font-size: 12px;
      font-weight: 950;
    }

    .notice {
      margin-top: 22px;
      padding: 18px 20px;
      border-radius: 20px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.8;
      background: rgba(255, 255, 255, 0.68);
    }

    .notice strong { color: var(--text); }
    .notice code { overflow-wrap: anywhere; }

    @media (max-width: 980px) {
      .guide { grid-template-columns: 1fr; }
      .prize-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 660px) {
      .page {
        width: min(100% - 20px, 1280px);
        margin: 20px auto 30px;
      }

      .topbar,
      .guide-main,
      .guide-steps,
      .catalog { border-radius: 20px; }

      .topbar { padding: 18px; }
      .guide-main { min-height: 245px; padding: 23px; }
      .guide-main::after { bottom: 17px; font-size: 62px; }
      .catalog { padding: 14px; }
      .prize-grid { grid-template-columns: 1fr; gap: 18px; }
      .prize-card { min-height: 460px; border-radius: 22px; }
      .prize-visual { aspect-ratio: 1 / 1; padding: 12px; }
      .prize-visual img { inset: 12px; width: calc(100% - 24px); height: calc(100% - 24px); }
      .prize-body { padding: 20px; }
      .nav a { padding: 10px 14px; font-size: 15px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div>
        <h1>代夾物</h1>
        <p class="subtitle">夾到 A、B、C、D、E 或 F 代夾物後，在這裡查詢可兌換的實際商品</p>
      </div>
    </header>

    <nav class="nav" aria-label="頁面導覽">
      <a href="index.html">排行榜</a>
      <a href="shop.html">點數兌換</a>
      <a class="active" href="token.html">代夾物</a>
      <a href="moments.html">活動花絮</a>
    </nav>

    <section class="catalog" aria-label="代夾物與獎品對照列表">
      <div id="prizeGrid" class="prize-grid"></div>
    </section>

    <section class="notice" aria-label="兌換注意事項">
      <strong>兌換提醒：</strong>
      請妥善保留夾到的代夾物，並上傳代夾物於Line群組內，台主會與您聯繫；獎品圖片、尺寸、顏色及包裝僅供辨識，實際內容以現場實物為準。
    </section>
  </main>

  <script>
    /*
      ===== A–F 對應獎品修改區 =====

      prize：實際獎品名稱
      desc：尺寸、款式或其他說明
      note：兌換時要提醒客人的內容
      image：圖片路徑，例如 assets/proxy/prize-a.jpg

      圖片不存在時，頁面會顯示字母占位圖，不會出現破圖。
    */
    const prizeMappings = [
      {
        code: "A",
        prize: "小老虎 抱枕",
        desc: "約 30 公分",
        note: "持代夾物 A 向台主兌換此商品",
        image: "assets/tokens/A.jpg",
        visualA: "#ff8fc7",
        visualB: "#806cff",
        softA: "#ffe2f1",
        softB: "#ddd8ff"
      },
      {
        code: "B",
        prize: "JBL Authentics 抱枕毯 約 36 公分",
        desc: "約36cm",
        note: "持代夾物 B 向台主兌換此商品",
        image: "assets/tokens/B.jpg",
        visualA: "#45c9e8",
        visualB: "#4f83ff",
        softA: "#d8f8ff",
        softB: "#dbe7ff"
      },
      {
        code: "C",
        prize: "娃娃坐墊/造型椅墊",
        desc: "熊嗨星 吉祥物坐墊 黃色 約 33 公分",
        note: "持代夾物 C 向台主兌換此商品",
        image: "assets/tokens/C.jpg",
        visualA: "#ffbd55",
        visualB: "#ff7f66",
        softA: "#fff0c9",
        softB: "#ffe0d8"
      },
      {
        code: "D",
        prize: "娃娃坐墊/造型椅墊",
        desc: "熊嗨星 吉祥物坐墊 綠色 約 33 公分",
        note: "持代夾物 D 向台主兌換此商品",
        image: "assets/tokens/D.jpg",
        visualA: "#55c999",
        visualB: "#218f82",
        softA: "#d9f7e9",
        softB: "#d7f1ed"
      },
      {
        code: "E",
        prize: "哆啦A夢 銅鑼燒 抱枕",
        desc: "約 40 公分",
        note: "持代夾物 E 向台主兌換此商品",
        image: "assets/tokens/E.jpg",
        visualA: "#b77cff",
        visualB: "#6f58e8",
        softA: "#eee0ff",
        softB: "#ddd8ff"
      },
      {
        code: "F",
        prize: "懶洋洋喵之助 娃娃",
        desc: "約 33 公分",
        note: "持代夾物 F 向台主兌換此商品",
        image: "assets/tokens/F.jpg",
        visualA: "#f26d9f",
        visualB: "#dc5875",
        softA: "#ffe0ec",
        softB: "#ffd9df"
      }
    ];

    const prizeGrid = document.querySelector("#prizeGrid");

    function escapeHTML(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function renderMappings() {
      const visibleItems = prizeMappings;

      prizeGrid.innerHTML = visibleItems.map(item => `
        <article class="prize-card" id="mapping-${escapeHTML(item.code)}">
          <div class="mapping-head" style="--visual-a:${escapeHTML(item.visualA)}; --visual-b:${escapeHTML(item.visualB)};">
            <div class="code-box">${escapeHTML(item.code)}</div>
            <div class="mapping-arrow" aria-hidden="true">→</div>
            <div class="mapping-copy">
              <small>夾到此代夾物</small>
              <strong>可兌換下方獎品</strong>
            </div>
          </div>

          <div
            class="prize-visual"
            style="--visual-a:${escapeHTML(item.visualA)}; --visual-b:${escapeHTML(item.visualB)}; --visual-soft-a:${escapeHTML(item.softA)}; --visual-soft-b:${escapeHTML(item.softB)};">
            <div class="image-placeholder" aria-hidden="true">
              <div class="placeholder-letter">${escapeHTML(item.code)}</div>
              <div class="placeholder-caption">請放入對應獎品照片</div>
            </div>
            <img
              src="${escapeHTML(item.image)}"
              alt="代夾物 ${escapeHTML(item.code)} 對應獎品：${escapeHTML(item.prize)}"
              loading="lazy"
              onerror="this.style.display='none'">
          </div>

          <div class="prize-body">
            <span class="prize-label">代夾物 ${escapeHTML(item.code)} 的對應獎品</span>
            <h2 class="prize-name">${escapeHTML(item.prize)}</h2>
            <p class="prize-desc">${escapeHTML(item.desc)}</p>
            <div class="exchange-note">${escapeHTML(item.note || `持 ${item.code} 代夾物向現場人員兌換此獎品`)}</div>
          </div>
        </article>
      `).join("");
    }

    renderMappings();
  </script>
</body>
</html>
