<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>點數兌換</title>
  <style>
    :root {
      --text: #1d2940;
      --muted: #5c6d86;
      --line: rgba(255, 255, 255, 0.45);
      --accent: #6a5cff;
      --accent-2: #4fa3ff;
      --card: rgba(255, 255, 255, 0.82);
      --card-2: rgba(255, 255, 255, 0.74);
      --shadow: 0 10px 30px rgba(31, 45, 76, 0.12);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      min-height: 100%;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC",
        "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
      color: var(--text);
      position: relative;
      overflow-x: hidden;
      background: #eaf2ff;
    }

    /*
      與排行榜 index.html 使用同一張背景圖。
      請將背景圖放在：assets/backgrounds/claw-bg.jpg

      如果你的排行榜目前用的是 claw-bg.png，
      請把下面這行也改成 assets/backgrounds/claw-bg.png。
    */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: url("assets/backgrounds/claw-bg.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: brightness(0.9) saturate(1.05);
      z-index: -2;
    }

    /* 與排行榜一致的霧面遮罩 */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background:
        linear-gradient(rgba(245, 249, 255, 0.72), rgba(245, 249, 255, 0.82)),
        radial-gradient(circle at top left, rgba(255, 182, 193, 0.18), transparent 25rem),
        radial-gradient(circle at top right, rgba(173, 216, 255, 0.18), transparent 25rem),
        radial-gradient(circle at bottom left, rgba(255, 223, 186, 0.18), transparent 25rem);
      z-index: -1;
    }

    .page {
      width: min(1280px, calc(100% - 28px));
      margin: 32px auto 56px;
    }

    .topbar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
      background: rgba(255, 255, 255, 0.70);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 22px 24px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 4vw, 44px);
      letter-spacing: 0.02em;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 15px;
      font-weight: 600;
    }

    .nav {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin: 20px 0 26px;
    }

    .nav a {
      color: var(--text);
      text-decoration: none;
      font-weight: 800;
      border: 1px solid rgba(255, 255, 255, 0.55);
      background: rgba(255, 255, 255, 0.72);
      border-radius: 999px;
      padding: 12px 18px;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.08);
      backdrop-filter: blur(10px);
    }

    .nav a.active,
    .nav a:hover {
      color: #ffffff;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-color: transparent;
    }

    .category-tabs {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding: 14px 0 16px;
      margin: 0 0 12px;
      background: linear-gradient(180deg, rgba(245, 249, 255, 0.68), rgba(245, 249, 255, 0.42));
      backdrop-filter: blur(12px);
      scrollbar-width: thin;
    }

    .category-tabs button {
      flex: 0 0 auto;
      border: 1px solid rgba(255, 255, 255, 0.55);
      background: rgba(255, 255, 255, 0.72);
      color: var(--text);
      font-size: 16px;
      font-weight: 850;
      border-radius: 999px;
      padding: 13px 24px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.08);
      backdrop-filter: blur(10px);
    }

    .category-tabs button.active,
    .category-tabs button:hover {
      color: #ffffff;
      border-color: transparent;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 14px 28px rgba(106, 92, 255, 0.28);
    }

    .shop-wrap {
      background: rgba(255, 255, 255, 0.62);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 20px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .shop-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 26px;
    }

    .product-card {
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 520px;
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 24px;
      background: linear-gradient(180deg, var(--card), var(--card-2));
      box-shadow: 0 8px 22px rgba(31, 45, 76, 0.08);
      backdrop-filter: blur(10px);
    }

    .product-image {
      height: 286px;
      display: grid;
      place-items: center;
      background: rgba(241, 247, 255, 0.70);
      border-bottom: 1px solid rgba(255, 255, 255, 0.55);
      position: relative;
    }

    .product-image::before,
    .product-image::after {
      content: "✦";
      position: absolute;
      font-size: 21px;
      line-height: 1;
      pointer-events: none;
    }

    .product-image::before {
      top: 24px;
      left: 28px;
      color: rgba(255, 143, 199, 0.60);
    }

    .product-image::after {
      right: 28px;
      bottom: 24px;
      color: rgba(79, 163, 255, 0.55);
    }

    .product-image img {
      width: 82%;
      height: 82%;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 10px 16px rgba(31, 45, 76, 0.12));
      position: relative;
      z-index: 1;
    }

    .product-body {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 26px 26px 22px;
    }

    .category-pill {
      align-self: flex-start;
      color: #255782;
      background: rgba(243, 248, 255, 0.82);
      border: 1px solid rgba(180, 211, 246, 0.78);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 15px;
      font-weight: 850;
      margin-bottom: 16px;
    }

    .product-name {
      margin: 0 0 12px;
      font-size: clamp(21px, 2.1vw, 26px);
      line-height: 1.28;
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .product-desc {
      margin: 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.55;
      font-weight: 650;
    }

    .product-footer {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-top: auto;
      padding-top: 28px;
    }

    .points,
    .stock {
      font-size: 18px;
      font-weight: 900;
      white-space: nowrap;
    }

    .points {
      color: #ffffff;
      border-radius: 999px;
      padding: 8px 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 10px 20px rgba(106, 92, 255, 0.18);
    }

    .stock {
      color: #345978;
    }

    .empty {
      display: none;
      text-align: center;
      padding: 54px 20px;
      color: var(--muted);
      font-weight: 800;
      border: 1px dashed rgba(255, 255, 255, 0.55);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.62);
      backdrop-filter: blur(10px);
    }

    @media (max-width: 980px) {
      .shop-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .page {
        width: min(100% - 20px, 1280px);
        margin: 20px auto 28px;
      }

      .topbar {
        padding: 18px;
        border-radius: 20px;
      }

      .shop-wrap {
        padding: 14px;
        border-radius: 20px;
      }

      .shop-grid {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .product-card {
        min-height: 460px;
        border-radius: 22px;
      }

      .product-image {
        height: 240px;
      }

      .product-body {
        padding: 22px 22px 20px;
      }

      .category-tabs {
        gap: 10px;
      }

      .category-tabs button {
        font-size: 15px;
        padding: 11px 18px;
      }

      .nav a {
        padding: 10px 14px;
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div>
        <h1>點數兌換</h1>
        <p class="subtitle">使用活動點數兌換商品，庫存售完為止</p>
      </div>
    </header>

    <nav class="nav" aria-label="頁面導覽">
      <a href="index.html">排行榜</a>
      <a class="active" href="shop.html">點數兌換</a>
      <a href="token.html">代夾物</a>
      <a href="moments.html">活動花絮</a>
    </nav>

    <section class="category-tabs" aria-label="商品分類">
      <button class="active" type="button" data-category="全部">全部</button>
      <button type="button" data-category="動物方城市">動物方城市</button>
      <button type="button" data-category="狸想世界">狸想世界</button>
      <button type="button" data-category="寶可夢">寶可夢</button>
      <button type="button" data-category="湯姆貓與傑利鼠">湯姆貓與傑利鼠</button>
      <button type="button" data-category="蠟筆小新">蠟筆小新</button>
      <button type="button" data-category="貓福珊迪">貓福珊迪</button>
      <button type="button" data-category="其它">其它</button>
    </section>

    <section class="shop-wrap" aria-label="商品兌換列表">
      <div id="shopGrid" class="shop-grid"></div>
      <p id="emptyMessage" class="empty">此分類目前沒有商品</p>
    </section>
  </main>

  <script>
    /*
      使用你最新版 shop.html 的分類與商品資料。
      商品圖片維持原本路徑：assets/products/
      背景圖片與排行榜一致：assets/backgrounds/claw-bg.jpg
    */

    const products = [
      {
        category: "其它",
        name: "正版 貓頭鷹 絨毛娃娃",
        desc: "絨毛娃娃 高約30cm",
        points: 40,
        stock: 1,
        image: "assets/products/Owl.jpg"
      },
      {
        category: "貓福珊迪",
        name: "正版 貓福珊迪 抱枕",
        desc: "熊款 抱枕 12英吋",
        points: 50,
        stock: 1,
        image: "assets/products/Mofusand-Bear.jpg"
      },
      {
        category: "貓福珊迪",
        name: "正版 貓福珊迪 抱枕",
        desc: "獅子款 抱枕 12英吋",
        points: 50,
        stock: 1,
        image: "assets/products/Mofusand-Lion.jpg"
      },
      {
        category: "其它",
        name: "正版 助六倉鼠 絨毛娃娃",
        desc: "絨毛娃娃 12英吋",
        points: 50,
        stock: 1,
        image: "assets/products/Sukeroku.jpg"
      },
      {
        category: "動物方城市",
        name: "正版 尼克 抱枕",
        desc: "抱枕 12英吋",
        points: 55,
        stock: 1,
        image: "assets/products/Nick.jpg"
      },
      {
        category: "寶可夢",
        name: "正版 波克比 絨毛娃娃",
        desc: "絨毛娃娃 高約28cm",
        points: 60,
        stock: 1,
        image: "assets/products/Togepi.jpg"
      },
      {
        category: "寶可夢",
        name: "正版 熊寶寶(月亮熊) 絨毛娃娃",
        desc: "絨毛娃娃 高約28cm",
        points: 60,
        stock: 1,
        image: "assets/products/Teddiursa.jpg"
      },
      {
        category: "寶可夢",
        name: "正版 皮卡丘 絨毛娃娃",
        desc: "站姿 絨毛娃娃 約30cm",
        points: 65,
        stock: 1,
        image: "assets/products/Pikachu.jpg"
      },
      {
        category: "寶可夢",
        name: "正版 鯉魚王 絨毛娃娃",
        desc: "絨毛娃娃 約30cm",
        points: 65,
        stock: 1,
        image: "assets/products/Magikarp.jpg"
      },
      {
        category: "蠟筆小新",
        name: "正版 蠟筆小新 絨毛娃娃",
        desc: "龍蝦裝 絨毛娃娃 12吋",
        points: 75,
        stock: 1,
        image: "assets/products/Lobster.jpg"
      },
      {
        category: "蠟筆小新",
        name: "正版 鋼達姆 暖手枕",
        desc: "絨毛款 暖手枕 約35cm",
        points: 85,
        stock: 1,
        image: "assets/products/Kantamu.jpg"
      },
      {
        category: "狸想世界",
        name: "正版 艾倫熊 絨毛娃娃",
        desc: "絨毛娃娃 約35cm",
        points: 125,
        stock: 1,
        image: "assets/products/EllenBear.jpg"
      },
      {
        category: "湯姆貓與傑利鼠",
        name: "正版 傑利鼠 絨毛娃娃",
        desc: "抱起司 絨毛娃娃 18英吋",
        points: 155,
        stock: 1,
        image: "assets/products/Jerrywithcheese.jpg"
      },
      {
        category: "蠟筆小新",
        name: "正版 蠟筆小新 絨毛娃娃",
        desc: "龍蝦裝 絨毛娃娃 18吋",
        points: 155,
        stock: 1,
        image: "assets/products/Lobster-big.jpg"
      }
    ];

    const shopGrid = document.querySelector("#shopGrid");
    const emptyMessage = document.querySelector("#emptyMessage");
    const buttons = document.querySelectorAll("[data-category]");

    function renderProducts(category = "全部") {
      const visibleProducts = category === "全部"
        ? products
        : products.filter(product => product.category === category);

      shopGrid.innerHTML = visibleProducts.map(product => `
        <article class="product-card">
          <div class="product-image">
            <img src="${product.image}" alt="${product.name}" loading="lazy">
          </div>
          <div class="product-body">
            <span class="category-pill">${product.category}</span>
            <h2 class="product-name">${product.name}</h2>
            <p class="product-desc">${product.desc}</p>
            <div class="product-footer">
              <div class="points">${product.points} 點</div>
              <div class="stock">庫存 ${product.stock}</div>
            </div>
          </div>
        </article>
      `).join("");

      emptyMessage.style.display = visibleProducts.length ? "none" : "block";
    }

    buttons.forEach(button => {
      button.addEventListener("click", () => {
        buttons.forEach(item => item.classList.remove("active"));
        button.classList.add("active");
        renderProducts(button.dataset.category);
      });
    });

    renderProducts();
  </script>
</body>
</html>
