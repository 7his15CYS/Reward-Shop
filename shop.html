<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>點數兌換</title>
  <style>
    :root {
      --bg: #eef3f8;
      --card: #ffffff;
      --image-bg: #f1f6fb;
      --text: #14233b;
      --muted: #66809d;
      --line: #d9e2ec;
      --accent: #6548f5;
      --accent-2: #2f7df6;
      --shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
      --radius: 26px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC",
        "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(101, 72, 245, 0.14), transparent 30rem),
        var(--bg);
      color: var(--text);
    }

    .page {
      width: min(1280px, calc(100% - 28px));
      margin: 28px auto 56px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 4vw, 46px);
      letter-spacing: 0.02em;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 15px;
      font-weight: 650;
    }

    .nav {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin: 20px 0 26px;
    }

    .nav a {
      color: var(--text);
      text-decoration: none;
      font-weight: 800;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.78);
      border-radius: 999px;
      padding: 12px 18px;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.05);
    }

    .nav a.active,
    .nav a:hover {
      color: #ffffff;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-color: transparent;
    }

    .category-tabs {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding: 14px 0 16px;
      margin: 0 0 12px;
      background: linear-gradient(180deg, rgba(238, 243, 248, 0.98), rgba(238, 243, 248, 0.84));
      backdrop-filter: blur(10px);
    }

    .category-tabs button {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.92);
      color: var(--text);
      font-size: 16px;
      font-weight: 850;
      border-radius: 999px;
      padding: 13px 24px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.05);
    }

    .category-tabs button.active {
      color: #ffffff;
      border-color: transparent;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 14px 28px rgba(101, 72, 245, 0.28);
    }

    .shop-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 26px;
    }

    .product-card {
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 520px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .product-image {
      height: 286px;
      display: grid;
      place-items: center;
      background: var(--image-bg);
      border-bottom: 1px solid rgba(217, 226, 236, 0.7);
    }

    .product-image img {
      width: 82%;
      height: 82%;
      object-fit: contain;
      display: block;
    }

    .product-body {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 26px 26px 22px;
    }

    .category-pill {
      align-self: flex-start;
      color: #255782;
      background: #f3f8ff;
      border: 1px solid #d7e6f6;
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 15px;
      font-weight: 850;
      margin-bottom: 16px;
    }

    .product-name {
      margin: 0 0 12px;
      font-size: clamp(21px, 2.1vw, 26px);
      line-height: 1.28;
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .product-desc {
      margin: 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.55;
      font-weight: 650;
    }

    .product-footer {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-top: auto;
      padding-top: 28px;
    }

    .points,
    .stock {
      font-size: 18px;
      font-weight: 900;
      white-space: nowrap;
    }

    .stock { color: #345978; }

    .empty {
      display: none;
      text-align: center;
      padding: 54px 20px;
      color: var(--muted);
      font-weight: 800;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.62);
    }

    @media (max-width: 980px) {
      .shop-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 640px) {
      .page {
        width: min(100% - 18px, 1280px);
        margin-top: 18px;
      }

      .shop-grid {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .product-card {
        min-height: 460px;
        border-radius: 22px;
      }

      .product-image { height: 240px; }

      .product-body { padding: 22px 22px 20px; }

      .category-tabs { gap: 10px; }

      .category-tabs button {
        font-size: 15px;
        padding: 11px 18px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div>
        <h1>點數兌換</h1>
        <p class="subtitle">使用活動點數兌換商品，庫存售完為止</p>
      </div>
    </header>

    <nav class="nav" aria-label="頁面導覽">
      <a href="index.html">排行榜</a>
      <a class="active" href="shop.html">點數兌換</a>
    </nav>

    <section class="category-tabs" aria-label="商品分類">
      <button class="active" type="button" data-category="全部">全部</button>
      <button type="button" data-category="動物方城市">動物方城市</button>
      <button type="button" data-category="狸想世界">狸想世界</button>
      <button type="button" data-category="寶可夢">寶可夢</button>
      <button type="button" data-category="湯姆貓與傑利鼠">湯姆貓與傑利鼠</button>
      <button type="button" data-category="蠟筆小新">蠟筆小新</button>
    </section>

    <section id="shopGrid" class="shop-grid" aria-label="商品列表"></section>
    <p id="emptyMessage" class="empty">此分類目前沒有商品</p>
  </main>

  <script>

    const products = [
      {
        category: "動物方城市",
        name: "正版 尼克 抱枕",
        desc: "抱枕 12英吋",
        points: 50,
        stock: 1,
        image: "assets/products/Nick.jpg"
      },
      {
        category: "寶可夢",
        name: "正版 波克比 絨毛娃娃",
        desc: "絨毛娃娃 高約28cm",
        points: 55,
        stock: 1,
        image: "assets/products/Togepi.jpg"
      },
      {
        category: "寶可夢",
        name: "正版 熊寶寶(月亮熊) 絨毛娃娃",
        desc: "絨毛娃娃 高約28cm",
        points: 55,
        stock: 1,
        image: "assets/products/Teddiursa.jpg"
      },
      {
        category: "寶可夢",
        name: "正版 皮卡丘 絨毛娃娃",
        desc: "站姿 絨毛娃娃 約30cm",
        points: 60,
        stock: 1,
        image: "assets/products/Pikachu.jpg"
      },
      {
        category: "寶可夢",
        name: "正版 鯉魚王 絨毛娃娃",
        desc: "絨毛娃娃 約30cm",
        points: 60,
        stock: 1,
        image: "assets/products/Magikarp.jpg"
      },
      {
        category: "蠟筆小新",
        name: "正版 蠟筆小新 絨毛娃娃",
        desc: "龍蝦裝 絨毛娃娃 12吋",
        points: 70,
        stock: 1,
        image: "assets/products/Lobster.jpg"
      },
      {
        category: "狸想世界",
        name: "正版 艾倫熊 絨毛娃娃",
        desc: "絨毛娃娃 約35cm",
        points: 120,
        stock: 1,
        image: "assets/products/EllenBear.jpg"
      },
      {
        category: "湯姆貓與傑利鼠",
        name: "正版 傑利鼠 絨毛娃娃",
        desc: "抱起司 絨毛娃娃 18英吋",
        points: 150,
        stock: 1,
        image: "assets/products/Jerrywithcheese.jpg"
      },
      {
        category: "蠟筆小新",
        name: "正版 蠟筆小新 絨毛娃娃",
        desc: "龍蝦裝 絨毛娃娃 18吋",
        points: 150,
        stock: 1,
        image: "assets/products/Lobster-big.jpg"
      }
    ];

    const shopGrid = document.querySelector("#shopGrid");
    const emptyMessage = document.querySelector("#emptyMessage");
    const buttons = document.querySelectorAll("[data-category]");

    function renderProducts(category = "全部") {
      const visibleProducts = category === "全部"
        ? products
        : products.filter(product => product.category === category);

      shopGrid.innerHTML = visibleProducts.map(product => `
        <article class="product-card">
          <div class="product-image">
            <img src="${product.image}" alt="${product.name}" loading="lazy">
          </div>
          <div class="product-body">
            <span class="category-pill">${product.category}</span>
            <h2 class="product-name">${product.name}</h2>
            <p class="product-desc">${product.desc}</p>
            <div class="product-footer">
              <div class="points">${product.points} 點</div>
              <div class="stock">庫存 ${product.stock}</div>
            </div>
          </div>
        </article>
      `).join("");

      emptyMessage.style.display = visibleProducts.length ? "none" : "block";
    }

    buttons.forEach(button => {
      button.addEventListener("click", () => {
        buttons.forEach(item => item.classList.remove("active"));
        button.classList.add("active");
        renderProducts(button.dataset.category);
      });
    });

    renderProducts();
  </script>
</body>
</html>
