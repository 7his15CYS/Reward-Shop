<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>點數兌換</title>
  <style>
    :root {
      --text: #1d2940;
      --muted: #60728d;
      --line: rgba(255, 255, 255, 0.56);
      --accent: #6a5cff;
      --accent-2: #4fa3ff;
      --pink: #ff8fc7;
      --yellow: #ffd56a;
      --card: rgba(255, 255, 255, 0.84);
      --card-2: rgba(255, 255, 255, 0.72);
      --shadow: 0 12px 34px rgba(31, 45, 76, 0.13);
      --radius: 28px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC",
        "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
      color: var(--text);
      position: relative;
      overflow-x: hidden;
      background: #eaf2ff;
    }

    /*
      背景圖片位置：
      assets/backgrounds/claw-bg.png

      請將可愛夾娃娃背景圖上傳到：
      Reward-Shop/assets/backgrounds/claw-bg.png
    */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: url("assets/backgrounds/claw-bg.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: brightness(0.92) saturate(1.05);
      z-index: -2;
    }

    /* 霧面遮罩，避免背景干擾文字閱讀 */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background:
        linear-gradient(rgba(247, 250, 255, 0.72), rgba(247, 250, 255, 0.86)),
        radial-gradient(circle at top left, rgba(255, 143, 199, 0.22), transparent 28rem),
        radial-gradient(circle at top right, rgba(79, 163, 255, 0.18), transparent 30rem),
        radial-gradient(circle at bottom left, rgba(255, 213, 106, 0.20), transparent 28rem);
      z-index: -1;
    }

    .page {
      width: min(1280px, calc(100% - 28px));
      margin: 28px auto 56px;
    }

    .topbar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      padding: 24px 26px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 4vw, 48px);
      letter-spacing: 0.02em;
      line-height: 1.1;
    }

    .subtitle {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 15px;
      font-weight: 700;
      line-height: 1.6;
    }

    .topbar::after {
      content: "🎁 ICL 集點活動";
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 12px 16px;
      color: #ffffff;
      font-weight: 900;
      background: linear-gradient(135deg, var(--pink), var(--accent));
      box-shadow: 0 12px 28px rgba(106, 92, 255, 0.20);
      white-space: nowrap;
    }

    .nav {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin: 20px 0 18px;
    }

    .nav a {
      color: var(--text);
      text-decoration: none;
      font-weight: 900;
      border: 1px solid rgba(255, 255, 255, 0.62);
      background: rgba(255, 255, 255, 0.76);
      border-radius: 999px;
      padding: 12px 18px;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
      backdrop-filter: blur(10px);
    }

    .nav a.active,
    .nav a:hover {
      color: #ffffff;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-color: transparent;
    }

    .category-tabs {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding: 14px 2px 18px;
      margin: 0 0 12px;
      background: linear-gradient(180deg, rgba(238, 243, 248, 0.82), rgba(238, 243, 248, 0.52));
      backdrop-filter: blur(12px);
      scrollbar-width: thin;
    }

    .category-tabs button {
      flex: 0 0 auto;
      border: 1px solid rgba(255, 255, 255, 0.68);
      background: rgba(255, 255, 255, 0.84);
      color: var(--text);
      font-size: 16px;
      font-weight: 950;
      border-radius: 999px;
      padding: 13px 24px;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.07);
      backdrop-filter: blur(10px);
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }

    .category-tabs button:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 28px rgba(15, 23, 42, 0.10);
    }

    .category-tabs button.active {
      color: #ffffff;
      border-color: transparent;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 16px 32px rgba(106, 92, 255, 0.28);
    }

    .shop-shell {
      border: 1px solid rgba(255, 255, 255, 0.52);
      border-radius: 32px;
      padding: 22px;
      background: rgba(255, 255, 255, 0.48);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }

    .shop-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 26px;
    }

    .product-card {
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 520px;
      border: 1px solid rgba(255, 255, 255, 0.58);
      border-radius: var(--radius);
      background: linear-gradient(180deg, var(--card), var(--card-2));
      box-shadow: 0 12px 28px rgba(31, 45, 76, 0.10);
      backdrop-filter: blur(12px);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .product-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 18px 38px rgba(31, 45, 76, 0.16);
    }

    .product-image {
      height: 286px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at center, rgba(255, 255, 255, 0.92), rgba(241, 247, 255, 0.62));
      border-bottom: 1px solid rgba(255, 255, 255, 0.58);
      position: relative;
    }

    .product-image::before,
    .product-image::after {
      content: "✦";
      position: absolute;
      color: rgba(255, 143, 199, 0.62);
      font-size: 22px;
      line-height: 1;
    }

    .product-image::before {
      top: 24px;
      left: 28px;
    }

    .product-image::after {
      right: 28px;
      bottom: 24px;
      color: rgba(79, 163, 255, 0.55);
    }

    .product-image img {
      width: 82%;
      height: 82%;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 10px 16px rgba(31, 45, 76, 0.12));
      position: relative;
      z-index: 1;
    }

    .product-body {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 26px 26px 22px;
    }

    .category-pill {
      align-self: flex-start;
      color: #255782;
      background: rgba(243, 248, 255, 0.82);
      border: 1px solid rgba(180, 211, 246, 0.78);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 15px;
      font-weight: 900;
      margin-bottom: 16px;
    }

    .product-name {
      margin: 0 0 12px;
      font-size: clamp(21px, 2.1vw, 26px);
      line-height: 1.28;
      font-weight: 950;
      letter-spacing: -0.02em;
    }

    .product-desc {
      margin: 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.55;
      font-weight: 700;
    }

    .product-footer {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-top: auto;
      padding-top: 28px;
    }

    .points,
    .stock {
      font-size: 18px;
      font-weight: 950;
      white-space: nowrap;
    }

    .points {
      color: #ffffff;
      border-radius: 999px;
      padding: 8px 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 10px 20px rgba(106, 92, 255, 0.18);
    }

    .stock {
      color: #345978;
    }

    .empty {
      display: none;
      text-align: center;
      padding: 54px 20px;
      color: var(--muted);
      font-weight: 900;
      border: 1px dashed rgba(255, 255, 255, 0.66);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.62);
      backdrop-filter: blur(10px);
    }

    @media (max-width: 980px) {
      .shop-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (max-width: 640px) {
      .page {
        width: min(100% - 18px, 1280px);
        margin-top: 18px;
      }

      .topbar {
        padding: 20px;
        border-radius: 24px;
      }

      .topbar::after {
        font-size: 14px;
        padding: 10px 14px;
      }

      .shop-shell {
        padding: 14px;
        border-radius: 24px;
      }

      .shop-grid {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .product-card {
        min-height: 460px;
        border-radius: 22px;
      }

      .product-image {
        height: 240px;
      }

      .product-body {
        padding: 22px 22px 20px;
      }

      .category-tabs {
        gap: 10px;
      }

      .category-tabs button {
        font-size: 15px;
        padding: 11px 18px;
      }

      .nav a {
        padding: 10px 14px;
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div>
        <h1>點數兌換</h1>
        <p class="subtitle">使用活動點數兌換商品，庫存售完為止</p>
      </div>
    </header>

    <nav class="nav" aria-label="頁面導覽">
      <a href="index.html">排行榜</a>
      <a class="active" href="shop.html">點數兌換</a>
    </nav>

    <section class="category-tabs" aria-label="商品分類">
      <button class="active" type="button" data-category="全部">全部</button>
      <button type="button" data-category="動物方城市">動物方城市</button>
      <button type="button" data-category="狸想世界">狸想世界</button>
      <button type="button" data-category="寶可夢">寶可夢</button>
      <button type="button" data-category="湯姆貓與傑利鼠">湯姆貓與傑利鼠</button>
      <button type="button" data-category="蠟筆小新">蠟筆小新</button>
      <button type="button" data-category="貓福珊迪">貓福珊迪</button>
      <button type="button" data-category="其它">其它</button>
    </section>

    <section class="shop-shell" aria-label="商品兌換列表">
      <div id="shopGrid" class="shop-grid"></div>
      <p id="emptyMessage" class="empty">此分類目前沒有商品</p>
    </section>
  </main>

  <script>
    /*
      此版本使用你上傳的最新版 shop.html 商品資料製作。

      背景圖片：
      assets/backgrounds/claw-bg.png

      商品圖片：
      assets/products/
    */

    const products = [
      {
        category: "貓福珊迪",
        name: "正版 貓福珊迪 抱枕",
        desc: "熊款 抱枕 12英吋",
        points: 50,
        stock: 1,
        image: "assets/products/Mofusand-Bear.jpg"
      },
      {
        category: "貓福珊迪",
        name: "正版 貓福珊迪 抱枕",
        desc: "獅子款 抱枕 12英吋",
        points: 50,
        stock: 1,
        image: "assets/products/Mofusand-Lion.jpg"
      },
      {
        category: "其它",
        name: "正版 助六倉鼠 絨毛娃娃",
        desc: "絨毛娃娃 12英吋",
        points: 50,
        stock: 1,
        image: "assets/products/Sukeroku.jpg"
      },
      {
        category: "其它",
        name: "正版 原神 胡桃幽靈 絨毛娃娃",
        desc: "絨毛娃娃 高約30cm",
        points: 55,
        stock: 1,
        image: "assets/products/Spirit.jpg"
      },
      {
        category: "動物方城市",
        name: "正版 尼克 抱枕",
        desc: "抱枕 12英吋",
        points: 55,
        stock: 1,
        image: "assets/products/Nick.jpg"
      },
      {
        category: "寶可夢",
        name: "正版 波克比 絨毛娃娃",
        desc: "絨毛娃娃 高約28cm",
        points: 60,
        stock: 1,
        image: "assets/products/Togepi.jpg"
      },
      {
        category: "寶可夢",
        name: "正版 熊寶寶(月亮熊) 絨毛娃娃",
        desc: "絨毛娃娃 高約28cm",
        points: 60,
        stock: 1,
        image: "assets/products/Teddiursa.jpg"
      },
      {
        category: "寶可夢",
        name: "正版 皮卡丘 絨毛娃娃",
        desc: "站姿 絨毛娃娃 約30cm",
        points: 65,
        stock: 1,
        image: "assets/products/Pikachu.jpg"
      },
      {
        category: "寶可夢",
        name: "正版 鯉魚王 絨毛娃娃",
        desc: "絨毛娃娃 約30cm",
        points: 65,
        stock: 1,
        image: "assets/products/Magikarp.jpg"
      },
      {
        category: "蠟筆小新",
        name: "正版 蠟筆小新 絨毛娃娃",
        desc: "龍蝦裝 絨毛娃娃 12吋",
        points: 75,
        stock: 1,
        image: "assets/products/Lobster.jpg"
      },
      {
        category: "蠟筆小新",
        name: "正版 鋼達姆 暖手枕",
        desc: "絨毛款 暖手枕 約35cm",
        points: 85,
        stock: 1,
        image: "assets/products/Kantamu.jpg"
      },
      {
        category: "狸想世界",
        name: "正版 艾倫熊 絨毛娃娃",
        desc: "絨毛娃娃 約35cm",
        points: 125,
        stock: 1,
        image: "assets/products/EllenBear.jpg"
      },
      {
        category: "湯姆貓與傑利鼠",
        name: "正版 傑利鼠 絨毛娃娃",
        desc: "抱起司 絨毛娃娃 18英吋",
        points: 155,
        stock: 1,
        image: "assets/products/Jerrywithcheese.jpg"
      },
      {
        category: "蠟筆小新",
        name: "正版 蠟筆小新 絨毛娃娃",
        desc: "龍蝦裝 絨毛娃娃 18吋",
        points: 155,
        stock: 1,
        image: "assets/products/Lobster-big.jpg"
      }
    ];

    const shopGrid = document.querySelector("#shopGrid");
    const emptyMessage = document.querySelector("#emptyMessage");
    const buttons = document.querySelectorAll("[data-category]");

    function renderProducts(category = "全部") {
      const visibleProducts = category === "全部"
        ? products
        : products.filter(product => product.category === category);

      shopGrid.innerHTML = visibleProducts.map(product => `
        <article class="product-card">
          <div class="product-image">
            <img src="${product.image}" alt="${product.name}" loading="lazy">
          </div>
          <div class="product-body">
            <span class="category-pill">${product.category}</span>
            <h2 class="product-name">${product.name}</h2>
            <p class="product-desc">${product.desc}</p>
            <div class="product-footer">
              <div class="points">${product.points} 點</div>
              <div class="stock">庫存 ${product.stock}</div>
            </div>
          </div>
        </article>
      `).join("");

      emptyMessage.style.display = visibleProducts.length ? "none" : "block";
    }

    buttons.forEach(button => {
      button.addEventListener("click", () => {
        buttons.forEach(item => item.classList.remove("active"));
        button.classList.add("active");
        renderProducts(button.dataset.category);
      });
    });

    renderProducts();
  </script>
</body>
</html>
